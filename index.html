rder-radius:9px;font-weight:700}.filter.active{background:var(--accent-soft);border-color:#b7cfc0;color:var(--accent)}.review-list{display:grid;gap:10px}.review-item{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px}.review-item h4{margin:0 0 11px;font-size:15px;line-height:1.5}.review-item .ans{font-size:13px;padding:8px 10px;border-radius:8px;margin-top:6px;background:#f6f7f5}.review-item .ans.correct{background:var(--green-soft);color:#205c3d}.review-item .ans.wrong{background:var(--red-soft);color:#8e2e2a}.result{display:none;background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}.result.show{display:block}.result-top{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}.score{font-size:42px;font-weight:850;letter-spacing:-.06em;color:var(--accent)}.result p{color:var(--muted);margin:4px 0 0;font-size:13px}.result-actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.footer-note{color:var(--muted);font-size:11px;text-align:center;margin-top:20px}@media(max-width:780px){.wrap{margin:18px auto;padding:0 12px 28px}.top-inner{padding:10px 12px}.brand h1{font-size:14px}.brand p{font-size:11px}.brand-mark{width:34px;height:34px}.top .btn{padding:8px 10px}.intro{align-items:flex-start;flex-direction:column;gap:10px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat{padding:10px 12px}.stat strong{font-size:21px}.layout{grid-template-columns:1fr}.side{position:static;order:2}.question-panel{padding:17px}.qtext{margin:18px 0}.option{padding:12px}.qfoot{margin-top:18px}.qfoot .btn{flex:1}.grid{grid-template-columns:repeat(8,1fr)}}@media(max-width:390px){.brand p{display:none}.brand h1{max-width:175px}.grid{grid-template-columns:repeat(6,1fr)}.qfoot{flex-wrap:wrap}.qfoot small{order:-1;width:100%;text-align:center}}

<script>
const questions=[{"id":1,"source":"Trang 1","question":"Theo Hồ Chí Minh, độc lập dân tộc là:","options":["cơ sở của chủ nghĩa xã hội","thành quả của chủ nghĩa xã hội","điều kiện để đi lên chủ nghĩa xã hội","quy luật tất yếu để xây dựng chủ nghĩa xã hội"],"correct":"điều kiện để đi lên chủ nghĩa xã hội","note":"Mẹo phân biệt Câu 1 (Trang 1) và Câu 5 (Trang 5): Nếu trong các lựa chọn không có cụm 'cơ sở, tiền đề để tiến lên của chủ nghĩa xã hội' thì chọn 'điều kiện để đi lên chủ nghĩa xã hội'."},{"id":2,"source":"Trang 2","question":"\"Đồng bào Nam bộ là dân nước Việt Nam. Sông có thể cạn, núi có thể mòn, song chân lý đó không bao giờ thay đổi.\" Câu nói này của Hồ Chí Minh được thể hiện trong tác phẩm nào của Người?","options":["Di chúc","Thư gửi đồng bào Nam bộ 1946","Tuyên ngôn độc lập 1945","Nhật ký trong tù"],"correct":"Thư gửi đồng bào Nam bộ 1946"},{"id":3,"source":"Trang 3","question":"Theo Hồ Chí Minh, muốn xây dựng chủ nghĩa xã hội trước hết cần có:","options":["Kinh tế phát triển","Con người xã hội chủ nghĩa","Sự giúp đỡ của quốc tế"],"correct":"Con người xã hội chủ nghĩa","note":"Bác Hồ dạy: 'Muốn xây dựng chủ nghĩa xã hội, trước hết cần có những con người xã hội chủ nghĩa'."},{"id":4,"source":"Trang 4","question":"Theo Hồ Chí Minh, chủ nghĩa xã hội là:","options":["điều kiện để đảm bảo nền độc lập dân tộc vững chắc","mục tiêu trước mắt để có độc lập dân tộc","thành quả của độc lập dân tộc"],"correct":"điều kiện để đảm bảo nền độc lập dân tộc vững chắc"},{"id":5,"source":"Trang 5","question":"Theo Hồ Chí Minh, độc lập dân tộc là:","options":["cơ sở, tiền đề để tiến lên của chủ nghĩa xã hội","thành quả của chủ nghĩa xã hội","điều kiện để đi lên chủ nghĩa xã hội"],"correct":"cơ sở, tiền đề để tiến lên của chủ nghĩa xã hội","note":"Lưu ý: Khi câu hỏi có lựa chọn 'cơ sở, tiền đề để tiến lên của chủ nghĩa xã hội' thì ưu tiên chọn đáp án này."},{"id":6,"source":"Trang 6","question":"Tác phẩm nào dưới đây tập hợp những bài giảng của Nguyễn Ái Quốc tại các lớp huấn luyện đào tạo cán bộ cách mạng ở Quảng Châu (Trung Quốc)?","options":["Đường Kách mệnh.","Bản án chế độ thực dân Pháp.","Nhật kí trong tù"],"correct":"Đường Kách mệnh."},{"id":7,"source":"Trang 7","question":"Hồ Chí Minh dạy: Đảng viên phải “lo trước..., vui sau...”. Chọn đáp án đúng điền vào dấu “...”.","options":["Thiên hạ/ thiên hạ.","Nhân dân/ Nhân dân","thiên hạ/ Nhân dân"],"correct":"Thiên hạ/ thiên hạ."},{"id":8,"source":"Trang 8","question":"Hội Việt Nam Cách mạng thanh niên là tổ chức cách mạng đi theo khuynh hướng nào?","options":["Vô sản.","Cải lương","Dân chủ tư sản"],"correct":"Vô sản."},{"id":9,"source":"Trang 9","question":"Mâu thuẫn cơ bản nhất của xã hội Việt Nam sau Chiến tranh thế giới thứ nhất là gì?","options":["Mâu thuẫn giữa giai cấp tư sản với chính quyền thực dân Pháp.","Mâu thuẫn giữa toàn thể dân tộc Việt Nam với thực dân Pháp.","Mâu thuẫn giữa giai cấp công nhân với thực dân Pháp và giai cấp tư sản."],"correct":"Mâu thuẫn giữa toàn thể dân tộc Việt Nam với thực dân Pháp."},{"id":10,"source":"Trang 10","question":"Sự kiện nào sau đây có ảnh hưởng tích cực đến phong trào cách mạng Việt Nam trong những năm 1919-1925?","options":["Cách mạng tháng Mười Nga 1917.","Phong trào yêu nước của kiều bào phát triển mạnh.","Chiến tranh thế giới thứ nhất kết thúc."],"correct":"Cách mạng tháng Mười Nga 1917."},{"id":11,"source":"Trang 11","question":"Đảng Cộng sản Việt Nam xác định: “Cùng với chủ nghĩa Mác - Lênin, tư tưởng Hồ Chí Minh là nền tảng tư tưởng, kim chỉ nam cho hành động cách mạng” trong nhiệm kỳ Đại hội nào?","options":["Nhiệm kỳ Đại hội VI.","Nhiệm kỳ Đại hội VII.","Nhiệm kỳ Đại hội VIII."],"correct":"Nhiệm kỳ Đại hội VII.","note":"Đại hội VII (năm 1991) là cột mốc lần đầu tiên Đảng khẳng định Tư tưởng Hồ Chí Minh cùng với chủ nghĩa Mác - Lênin là nền tảng tư tưởng, kim chỉ nam cho hành động."},{"id":12,"source":"Trang 12","question":"Vai trò nào của Nguyễn Ái Quốc được xem là tiền đề tư tưởng quan trọng nhất cho sự ra đời của Đảng Cộng sản Việt Nam?","options":["Thành lập Hội Việt Nam Cách mạng Thanh niên.","Truyền bá chủ nghĩa Mác – Lênin vào Việt Nam.","Thành lập Công hội đỏ."],"correct":"Truyền bá chủ nghĩa Mác – Lênin vào Việt Nam."},{"id":13,"source":"Trang 13","question":"Nhận định nào phản ánh đầy đủ nhất vai trò của Nguyễn Ái Quốc đối với sự ra đời của Đảng Cộng sản Việt Nam?","options":["Người chỉ là đại diện của Quốc tế Cộng sản tại Đông Dương.","Người là người triệu tập hội nghị thành lập Đảng.","Người chuẩn bị về chính trị, tư tưởng, tổ chức và trực tiếp chủ trì việc thành lập Đảng."],"correct":"Người chuẩn bị về chính trị, tư tưởng, tổ chức và trực tiếp chủ trì việc thành lập Đảng."},{"id":14,"source":"Trang 14","question":"Điểm khác biệt cơ bản giữa Nguyễn Ái Quốc với các nhà yêu nước tiền bối khi tìm đường cứu nước là:","options":["Chủ trương dựa vào các nước phương Tây.","Xác định con đường cách mạng vô sản là con đường giải phóng dân tộc.","Chỉ chú trọng đấu tranh vũ trang."],"correct":"Xác định con đường cách mạng vô sản là con đường giải phóng dân tộc."},{"id":15,"source":"Trang 15","question":"Sự kiện nào đánh dấu Nguyễn Ái Quốc bước đầu tìm thấy con đường cứu nước đúng đắn?","options":["Đọc Sơ thảo luận cương của Lênin về vấn đề dân tộc và thuộc địa.","Tham dự đại hội Tua và tham gia sáng lập đảng xã hội Pháp.","Gửi yêu sách tám điểm đến Hội nghị Vécxai."],"correct":"Đọc Sơ thảo luận cương của Lênin về vấn đề dân tộc và thuộc địa."},{"id":16,"source":"Trang 16","question":"Hồ Chí Minh khẳng định hệ thống lý luận cách mạng của chủ nghĩa Mác - Lênin là:","options":["Bửu bối thần kỳ","Bửu bối diệu kỳ","Cẩm nang thần kỳ"],"correct":"Cẩm nang thần kỳ"},{"id":17,"source":"Trang 17","question":"Chọn cụm từ đúng điền vào chỗ trống: Trong Cương lĩnh chính trị đầu tiên của Đảng do Nguyễn Ái Quốc soạn thảo đã xác định phương hướng chiến lược là: “làm tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới ....”","options":["Chủ nghĩa tư bản","Chủ nghĩa xã hội","Xã hội Cộng sản"],"correct":"Chủ nghĩa xã hội"},{"id":18,"source":"Trang 18","question":"Hội Việt Nam cách mạng thanh niên được xem là:","options":["tổ chức chính trị của giai cấp tiểu tư sản.","tổ chức tiền thân của Đảng Cộng sản Việt Nam.","tổ chức cách mạng theo khuynh hướng dân chủ tư sản."],"correct":"tổ chức tiền thân của Đảng Cộng sản Việt Nam."},{"id":19,"source":"Trang 19","question":"Chọn đáp án đúng điền vào dấu “...” theo thứ tự trong lời dạy của Chủ tịch Hồ Chí Minh: “Đạo đức cách mạng không phải trên trời sa xuống. Nó do đấu tranh, rèn luyện bền bỉ hằng ngày mà phát triển và củng cố. Cũng như ... càng mài càng sáng, ... càng luyện càng trong\".","options":["“vàng” và “ngọc”.","“đá” và “vàng”.","“ngọc” và “vàng”."],"correct":"“ngọc” và “vàng”.","note":"Mẹo nhớ: NGỌC thì MÀI (ngọc càng mài càng sáng), VÀNG thì LUYỆN trong lửa (vàng càng luyện càng trong)."},{"id":20,"source":"Trang 20","question":"Năm 1919, Nguyễn Ái Quốc gửi đến Hội nghị Vécxai Bản yêu sách của nhân dân An Nam đòi Chính phủ Pháp thừa nhận quyền:","options":["Tự do","Độc lập","Dân chủ"],"correct":"Tự do"},{"id":21,"source":"Trang 21","question":"Cơ quan ngôn luận của Hội Việt Nam Cách mạng thanh niên là tờ báo nào?","options":["Nhân dân","Nhành lúa","Thanh niên"],"correct":"Thanh niên"},{"id":22,"source":"Trang 22","question":"Chọn đáp án đúng điền vào dấu “...” trong Di chúc của Chủ tịch Hồ Chí Minh: “việc cần phải làm trước tiên là ..., làm cho mỗi đảng viên, mỗi đoàn viên, mỗi chi bộ đều ra sức làm tròn nhiệm vụ đảng giao phó cho mình, toàn tâm toàn ý phục vụ nhân dân”.","options":["xây dựng lại Đảng.","chỉnh đốn lại Đảng.","xây dựng và chỉnh đốn lại Đảng."],"correct":"chỉnh đốn lại Đảng."},{"id":23,"source":"Trang 23","question":"Nếu không có sự chủ trì của Nguyễn Ái Quốc tại Hội nghị hợp nhất các tổ chức cộng sản đầu năm 1930, nguy cơ lớn nhất đối với phong trào cách mạng Việt Nam lúc đó là gì?","options":["Không có giai cấp công nhân Việt Nam.","Phong trào dân tộc hoàn toàn chấm dứt.","Tình trạng chia rẽ giữa các tổ chức cộng sản tiếp tục kéo dài."],"correct":"Tình trạng chia rẽ giữa các tổ chức cộng sản tiếp tục kéo dài."},{"id":24,"source":"Trang 24","question":"Vận dụng một trong những tư tưởng Hồ Chí Minh về công tác xây dựng Đảng trong sạch vững mạnh cần phải làm gì?","options":["Phải đề ra đường lối chủ trương cho Nhà nước","Phải tổ chức thực hiện tốt đường lối, chủ trương của Đảng","Phải chú trọng hơn nữa công tác cán bộ","Tuân thủ quy định của pháp luật"],"correct":"Phải tổ chức thực hiện tốt đường lối, chủ trương của Đảng"},{"id":25,"source":"Trang 25","question":"Nhà nước của dân theo tư tưởng Hồ Chí Minh nghĩa là:","options":["Chăm lo mọi mặt đời sống của nhân dân","Mọi quyền lực nhà nước và trong xã hội đều thuộc về nhân dân","Mọi công việc nhà nước đều do dân quyết định"],"correct":"Mọi quyền lực nhà nước và trong xã hội đều thuộc về nhân dân"},{"id":26,"source":"Trang 26","question":"Điểm đặc sắc nhất trong tư tưởng Hồ Chí Minh về Nhà nước pháp quyền là gì?","options":["Bảo đảm tính nghiêm minh của pháp luật.","Coi trọng luật pháp trong quản lý xã hội.","Đề cao đạo đức trong quản lý xã hội.","Kết hợp pháp luật và đạo đức."],"correct":"Kết hợp pháp luật và đạo đức."},{"id":27,"source":"Trang 27","question":"«Kẻ địch bên trong là........... của kẻ địch bên ngoài. Địch bên ngoài không đáng sợ. Địch bên trong đáng sợ hơn, vì nó phá hoại từ trong phá ra». Hãy hoàn thiện quan điểm trên của Chủ tịch Hồ Chí Minh.","options":["một bạn thân","một bạn đồng minh","một người thân thiết","một người thân cận"],"correct":"một bạn đồng minh"},{"id":28,"source":"Trang 28","question":"“Dân là chủ” trong nhà nước của dân theo quan niệm Hồ Chí Minh được xác định:","options":["Địa vị, vị thế của người dân","Năng lực, trách nhiệm của người dân.","Mang lại lợi ích cho dân"],"correct":"Địa vị, vị thế của người dân","note":"Mẹo nhớ: 'Dân là chủ' = xác định vị thế, địa vị; 'Dân làm chủ' = xác định năng lực, trách nhiệm, hành động."},{"id":29,"source":"Trang 29","question":"Luận điểm: \"Đảng muốn vững thì phải có chủ nghĩa làm cốt,... Đảng mà không có chủ nghĩa cũng như người không có trí khôn, tàu không có bàn chỉ nam” được trích từ tác phẩm nào của Nguyễn Ái Quốc?","options":["Tuyên ngôn độc lập","Đường Kách mệnh.","Điều lệ vắn tắt của Đảng.","Thường thức chính trị."],"correct":"Đường Kách mệnh."},{"id":30,"source":"Trang 30","question":"Một trong những quan điểm của Hồ Chí Minh về xây dựng đội ngũ cán bộ đảng viên là phải:","options":["Học tập và làm theo tấm gương đạo đức của Mác - Lênin","Phải gương mẫu trước quần chúng nhân dân","Nghiêm chỉnh thực hiện cương lĩnh, đường lối, quan điểm, chủ trương, nghị quyết và các nguyên tắc xây dựng đảng","Tận tụy phục vụ quần chúng nhân dân"],"correct":"Nghiêm chỉnh thực hiện cương lĩnh, đường lối, quan điểm, chủ trương, nghị quyết và các nguyên tắc xây dựng đảng"},{"id":31,"source":"Trang 31","question":"Theo Hồ Chí Minh, công tác gốc của Đảng là gì?","options":["Công tác tư tưởng chính trị.","Công tác lý luận.","Công tác cán bộ."],"correct":"Công tác cán bộ.","note":"Bác Hồ khẳng định: 'Cán bộ là cái gốc của mọi công việc', vì vậy Công tác cán bộ là công tác gốc của Đảng."},{"id":32,"source":"Trang 32","question":"Trong công tác cán bộ, Hồ Chí Minh quan niệm rằng:","options":["Muôn việc thành công hay thất bại đều do cán bộ tốt hay kém","Muôn việc hoạt động cách mạng thành công hoặc không thành công đều do cán bộ tốt hay kém","Cán bộ là nòng cốt của sự nghiệp đấu tranh giải phóng dân tộc","Cán bộ là lực lượng đấu tranh chủ yếu của cách mạng"],"correct":"Muôn việc thành công hay thất bại đều do cán bộ tốt hay kém","note":"Trích dẫn nguyên văn ngắn gọn của Bác: 'Muôn việc thành công hay thất bại đều do cán bộ tốt hay kém'."},{"id":33,"source":"Trang 33","question":"Theo Hồ Chí Minh, điều gì quan trọng nhất để cán bộ, công chức thực sự phục vụ nhân dân?","options":["Năng lực chuyên môn cao","Có đạo đức cách mạng trong sáng","Thực hiện theo Điều lệ vắn tắt của Đảng","Có nhiều kinh nghiệm thực tế"],"correct":"Có đạo đức cách mạng trong sáng"},{"id":34,"source":"Trang 34","question":"Đảng ta phát động học tập và làm theo Di chúc Chủ tịch Hồ Chí Minh năm nào?","options":["1969","1965","1961"],"correct":"1969"},{"id":35,"source":"Trang 35","question":"Giá trị tư tưởng Hồ Chí Minh đối với cách mạng Việt Nam là....","options":["là nền tảng tư tưởng và kim chỉ nam cho cách mạng Việt Nam trong thời chống phong kiến","đưa cách mạng giải phóng dân tộc Việt Nam đến thắng lợi và bắt đầu xây dựng một xã hội mới trên đất nước ta.","là nền tảng tư tưởng và kim chỉ nam cho mọi hành động"],"correct":"đưa cách mạng giải phóng dân tộc Việt Nam đến thắng lợi và bắt đầu xây dựng một xã hội mới trên đất nước ta."},{"id":36,"source":"Trang 36","question":"\"Nghiên cứu, học tập tư tưởng Hồ Chí Minh đòi hỏi không chỉ biết kế thừa, vận dụng mà còn phải biết phát triển sáng tạo tư tưởng của Người trong điều kiện lịch sử mới, trong bối cảnh cụ thể của đất nước và quốc tế\" Đây là phương pháp luận nào trong nghiên cứu TTHCM?","options":["Thống nhất lý luận và thực tiễn","Quan điểm lịch sử - cụ thể","Quan điểm kế thừa và phát triển"],"correct":"Quan điểm kế thừa và phát triển"},{"id":37,"source":"Trang 37","question":"Có bao nhiêu phương pháp luận của việc nghiên cứu tư tưởng Hồ Chí Minh?","options":["2","3","4","5"],"correct":"5"},{"id":38,"source":"Trang 38","question":"Đại hội XIII của Đảng (2021) khẳng định quan điểm chỉ đạo là:","options":["“Kiên định và vận dụng phát triển sáng tạo chủ nghĩa Mác-Lênin”","“Kiên định và vận dụng phát triển sáng tạo chủ nghĩa Mác-Lênin, tư tưởng Hồ Chí Minh”","“Phát huy và vận dụng phát triển sáng tạo chủ nghĩa Mác-Lênin, tư tưởng Hồ Chí Minh”","“Kiên định và học tập theo tư tưởng Hồ Chí Minh\""],"correct":"“Kiên định và vận dụng phát triển sáng tạo chủ nghĩa Mác-Lênin, tư tưởng Hồ Chí Minh”"},{"id":39,"source":"Trang 39","question":"“Đức Phật là đại từ đại bi, cứu khổ cứu nạn, muốn cứu chúng sinh khỏi khổ nạn, Người phải hi sinh tranh đấu, diệt lũ ác ma. Nay đồng bào ta đại đoàn kết, hi sinh của cải xương máu, kháng chiến đến cùng để đánh tan thực dân phản động, để cứu quốc dân ra khỏi khổ nạn, để giữ quyền thống nhất và độc lập Tổ quốc. Thế là chúng ta làm theo lòng đại từ đại bi của Đức Phật Thích Ca, kháng chiến để đưa giống nòi ra khỏi khổ ải nô lệ”. Đoạn trích này được Hồ Chí Minh viết trong văn bản nào?","options":["Thư gửi đồng bào Phật tử","Thư gửi hội Phật tử"],"correct":"Thư gửi hội Phật tử"},{"id":40,"source":"Trang 40","question":"Có mấy cơ sở lý luận hình thành tư tưởng Hồ Chí Minh?","options":["3","4","5"],"correct":"3","note":"3 cơ sở lý luận gồm: (1) Giá trị truyền thống tốt đẹp của dân tộc Việt Nam, (2) Tinh hoa văn hóa nhân loại, (3) Chủ nghĩa Mác - Lênin."},{"id":41,"source":"Trang 41","question":"Đối với sự phát triển tiến bộ của nhân loại, Tư tưởng Hồ Chí Minh:","options":["góp phần mở ra cho các dân tộc thuộc địa con đường giải phóng dân tộc gắn với sự tiến bộ xã hội","góp phần mở ra cho các dân tộc thuộc địa con đường giải phóng dân tộc và ngày càng phát triển","góp phần mở ra cho các dân tộc thuộc địa con đường giải phóng dân tộc chống thực dân xâm lược"],"correct":"góp phần mở ra cho các dân tộc thuộc địa con đường giải phóng dân tộc gắn với sự tiến bộ xã hội"},{"id":42,"source":"Trang 42","question":"Hồ Chí Minh từng nhận định: \"Học thuyết... có ưu điểm là sự tu dưỡng đạo đức cá nhân. Tôn giáo ........ có ưu điểm là lòng nhân ái cao cả. Chủ nghĩa.... có ưu điểm là phương pháp làm việc biện chứng\". Anh (chị) hãy điền vào các khoảng trống trên.","options":["Mác - Khổng Tử - Tôn Dật Tiên","Giêsu - Khổng Tử - Mác","Khổng Tử - Giêsu - Mác"],"correct":"Khổng Tử - Giêsu - Mác"},{"id":43,"source":"Trang 43","question":"Phong trào Duy Tân do ai khởi xướng?","options":["Lương Văn Can","Phan Bội Châu","Phan Châu Trinh"],"correct":"Phan Châu Trinh","note":"Mẹo nhớ: Phong trào ĐÔNG DU = Phan Bội Châu; Phong trào DUY TÂN = Phan Châu Trinh; ĐÔNG KINH NGHĨA THỤC = Lương Văn Can."},{"id":44,"source":"Trang 44","question":"\"Bao giờ Tây nhổ hết cỏ nước Nam mới hết người Nam đánh Tây\" Câu nói này của ai?","options":["Nguyễn Trung Trực","Nguyễn Ái Quốc","Hồ Chí Minh"],"correct":"Nguyễn Trung Trực"},{"id":45,"source":"Trang 45","question":"Năm 1969, Đảng ta phát động học tập và làm theo......","options":["tấm gương đạo đức Hồ Chí Minh","Di chúc Chủ tịch Tôn Đức Thắng","Di chúc Chủ tịch Hồ Chí Minh"],"correct":"Di chúc Chủ tịch Hồ Chí Minh"},{"id":46,"source":"Trang 46","question":"12/1920, tại Đại hội Tua của Đảng Xã hội Pháp, Người đã....","options":["tham gia quốc tế cộng sản","tham gia sáng lập Đảng Cộng sản Pháp.","Ra báo người cùng khổ"],"correct":"tham gia sáng lập Đảng Cộng sản Pháp."},{"id":47,"source":"Trang 47","question":"Phong trào Đông Du là do ai khởi xướng?","options":["Phan Bội Châu","Phan Châu Trinh","Vua Hàm Nghi"],"correct":"Phan Bội Châu"},{"id":48,"source":"Trang 48","question":"“Tư tưởng Hồ Chí Minh là ................ là kết quả của sự vận dụng và phát triển sáng tạo chủ nghĩa Mác - Lênin vào điều kiện cụ thể của nước ta, kế thừa và phát triển các giá trị truyền thống tốt đẹp của dân tộc, tiếp thu tinh hoa văn hóa nhân loại; là tài sản tinh thần vô cùng to lớn và quý giá của Đảng và dân tộc ta, mãi mãi soi đường cho cuộc cách mạng của nhân dân ta giành thắng lợi”.","options":["một hệ thống quan điểm toàn diện và sâu sắc về những vấn đề cơ bản của cách mạng Việt Nam,","một hệ thống quan điểm về vấn đề cơ bản của cách mạng Việt Nam,"],"correct":"một hệ thống quan điểm toàn diện và sâu sắc về những vấn đề cơ bản của cách mạng Việt Nam,"},{"id":49,"source":"Trang 49","question":"Tư tưởng Hồ Chí Minh là:","options":["Hệ thống quan điểm toàn diện về những vấn đề cơ bản của cách mạng Việt Nam","Hệ thống quan điểm toàn diện và sâu sắc về những vấn đề cơ bản của cách mạng Việt Nam","Hệ thống quan điểm về những vấn đề cơ bản của cách mạng Việt Nam"],"correct":"Hệ thống quan điểm toàn diện và sâu sắc về những vấn đề cơ bản của cách mạng Việt Nam"},{"id":50,"source":"Trang 50","question":"Trước ảnh hưởng của các cuộc vận động cải cách, của cách mạng dân chủ tư sản ở Trung Quốc và tấm gương Duy Tân của Nhật Bản, Việt Nam xuất hiện các phong trào yêu nước theo...","options":["khuynh hướng xã hội chủ nghĩa","phong kiến","khuynh hướng dân chủ tư sản"],"correct":"khuynh hướng dân chủ tư sản"},{"id":51,"source":"Trang 51","question":"Có mấy ý nghĩa của việc học tập môn học tư tưởng Hồ Chí Minh?","options":["3","4","5","6"],"correct":"3"},{"id":52,"source":"Trang 52","question":"Nghị quyết số 24C/18.65 về kỷ niệm 100 năm Ngày sinh của Chủ tịch Hồ Chí Minh của Đại hội đồng Tổ chức Giáo dục, Khoa học và Văn hóa của Liên hợp quốc (UNESCO) khóa 24 năm 1987 đã vinh danh Chủ tịch Hồ Chí Minh là:","options":["Anh hùng giải phóng dân tộc và Nhà văn hóa lớn của Việt Nam.","Anh hùng giải phóng dân tộc và Nhà văn hóa kiệt xuất của thế giới.","Anh hùng giải phóng dân tộc và Nhà văn hóa kiệt xuất của Việt Nam."],"correct":"Anh hùng giải phóng dân tộc và Nhà văn hóa kiệt xuất của Việt Nam."},{"id":53,"source":"Trang 53","question":"Chủ tịch Hồ Chí Minh từng khẳng định: “Tôi chỉ có một ham muốn, ham muốn tột bậc, là làm sao cho nước ta được hoàn toàn ......., dân ta được hoàn toàn tự do, đồng bào ai cũng có cơm ăn, áo mặc, ai cũng được học hành.” Hãy điền vào khoảng trống trên.","options":["sạch bóng quân thù","giải phóng","tự do","độc lập"],"correct":"độc lập"},{"id":54,"source":"Trang 54","question":"\"Cần có sự lãnh đạo của một đảng cách mạng chân chính của GCCN, toàn tâm toàn ý phục vụ nhân dân. Chỉ có sự lãnh đạo của một đảng biết vận dụng một cách sáng tạo chủ nghĩa Mác-Lênin vào điều kiện cụ thể của nước mình mới có thể đưa ....... và CM XHCN đến thành công\". Hãy hoàn thiện quan điểm trên của Hồ Chí Minh.","options":["CM vô sản","CM bạo lực vũ trang","CM GPDT"],"correct":"CM GPDT"},{"id":55,"source":"Trang 55","question":"Theo Hồ Chí Minh Cách mệnh trước hết phải có gì? Trước hết phải có đảng cách mệnh, để trong thì vận động và tổ chức dân chúng, ngoài thì liên lạc với dân tộc bị áp bức và vô sản giai cấp mọi nơi. Đảng có vững cách mệnh mới thành công, cũng như ......... có vững thuyền mới chạy.","options":["người cầm lái","thuyền trưởng","người chỉ huy","người lái đò"],"correct":"người cầm lái"},{"id":56,"source":"Trang 56","question":"Theo Hồ Chí Minh, cách mạng giải phóng dân tộc muốn thắng lợi phải đi theo con đường nào?","options":["Cách mạng dân chủ tư sản","cách mạng tư sản","cách mạng vô sản","cải cách đất nước"],"correct":"cách mạng vô sản"},{"id":57,"source":"Trang 57","question":"Theo Hồ Chí Minh, một trong số các nguyên tắc xây dựng chủ nghĩa xã hội trong thời kỳ quá độ là:","options":["Lấy dân làm gốc","Tập trung dân chủ là tiêu chí tiên quyết","Mọi tư tưởng và hành động phải thực hiện trên nền tảng chủ nghĩa Mác - Lê nin"],"correct":"Mọi tư tưởng và hành động phải thực hiện trên nền tảng chủ nghĩa Mác - Lê nin"}];
let current=0,answers={},submitted=false,reviewFilter='all',autoTimer=null,sessionQuestions=[],optionSets={};
const $=id=>document.getElementById(id);
const letters=['A','B','C','D','E','F'];
function shuffled(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startRandomSession(){sessionQuestions=shuffled(questions);optionSets={};sessionQuestions.forEach(q=>optionSets[q.id]=shuffled(q.options));}
function isCorrect(q){return answers[q.id]===q.correct}
function counts(){let answered=questions.filter(q=>answers[q.id]!==undefined).length;let correct=questions.filter(q=>answers[q.id]!==undefined&&isCorrect(q)).length;return {answered,correct,wrong:answered-correct,unanswered:questions.length-answered}}
function updateStats(){const c=counts();$('answered').textContent=c.answered+' / '+questions.length;if(submitted){$('correctCount').textContent=c.correct;$('unanswered').textContent=c.unanswered}$('progressBar').style.width=(c.answered/questions.length*100)+'%';renderGrid()}
function renderGrid(){const grid=$('questionGrid');grid.innerHTML='';sessionQuestions.forEach((q,i)=>{const b=document.createElement('button');b.textContent=i+1;b.className=(i===current?'active ':'')+(answers[q.id]!==undefined?(isCorrect(q)?'correct':'wrong'):'');b.setAttribute('aria-label','Câu '+(i+1));b.onclick=()=>go(i);grid.appendChild(b)})}
function render(){const q=sessionQuestions[current];$('qNumber').textContent='Câu '+(current+1)+' / '+sessionQuestions.length;$('source').textContent=q.source||('Câu '+q.id);$('question').textContent=q.question;$('qStatus').textContent=answers[q.id]===undefined?'Chưa trả lời':(isCorrect(q)?'Chính xác':'Chưa chính xác');$('qStatus').className='pill '+(answers[q.id]!==undefined?(isCorrect(q)?'green':'red'):'');const opts=$('options');opts.innerHTML='';optionSets[q.id].forEach((opt,i)=>{const b=document.createElement('button');b.className='option';b.innerHTML='<span class="letter">'+letters[i]+'</span><span></span>';b.lastElementChild.textContent=opt;if(answers[q.id]===opt)b.classList.add('chosen');if(answers[q.id]!==undefined&&opt===q.correct)b.classList.add('correct');if(answers[q.id]===opt&&opt!==q.correct)b.classList.add('wrong');if(submitted)b.disabled=true;else b.onclick=()=>selectAnswer(q,opt);opts.appendChild(b)});const fb=$('feedback');fb.className='feedback';fb.textContent='';if(answers[q.id]!==undefined||submitted){fb.classList.add('show',answers[q.id]===undefined?'bad':(isCorrect(q)?'good':'bad'));fb.append(document.createTextNode(answers[q.id]===undefined?'Chưa trả lời câu này. ':isCorrect(q)?'Chính xác! Mày chọn đúng rồi. ':'Chưa đúng rồi. '));const strong=document.createElement('strong');strong.textContent='Đáp án đúng: '+q.correct;fb.append(strong);if(q.note){const note=document.createElement('div');note.className='note';note.textContent=q.note;fb.append(note)}}$('prev').disabled=current===0;$('next').disabled=current===questions.length-1;$('next').textContent=current===questions.length-1?'Đã đến câu cuối':'Câu tiếp →';updateStats()}
function selectAnswer(q,opt){if(submitted)return;clearTimeout(autoTimer);answers[q.id]=opt;render()}
function go(i){clearTimeout(autoTimer);current=Math.max(0,Math.min(sessionQuestions.length-1,i));render();if(window.matchMedia('(max-width:780px)').matches){$('quizView').scrollIntoView({behavior:'smooth',block:'start'})}}
function submit(){if(submitted){showReview('all');return}const c=counts();submitted=true;document.body.classList.add('graded');const score=(c.correct/questions.length*10).toFixed(2).replace(/.00$/,'');$('score').textContent=score+'/10';$('resultSummary').textContent='Đúng '+c.correct+' câu · Sai '+c.wrong+' câu · Chưa làm '+c.unanswered+' câu trên tổng '+questions.length+' câu.';$('result').classList.add('show');render();$('result').scrollIntoView({behavior:'smooth',block:'start'})}
function showReview(filter='all'){if(!submitted){alert('Nộp bài và chấm điểm trước rồi mới xem lại đáp án nhé.');return}reviewFilter=filter;$('quizView').classList.add('hidden');$('reviewView').classList.add('show');document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));renderReview();$('reviewView').scrollIntoView({behavior:'smooth',block:'start'})}
function renderReview(){const list=$('reviewList');list.innerHTML='';const filtered=sessionQuestions.filter(q=>reviewFilter==='all'||(reviewFilter==='wrong'&&answers[q.id]!==undefined&&!isCorrect(q))||(reviewFilter==='correct'&&answers[q.id]!==undefined&&isCorrect(q))||(reviewFilter==='unanswered'&&answers[q.id]===undefined));$('reviewTitle').textContent='Xem lại đáp án · '+filtered.length+' câu';if(!filtered.length){const p=document.createElement('div');p.className='review-item';p.textContent='Không có câu nào trong mục này.';list.appendChild(p);return}filtered.forEach(q=>{const item=document.createElement('article');item.className='review-item';const h=document.createElement('h4');h.textContent=(q.source||('Câu '+q.id))+'. '+q.question;item.appendChild(h);optionSets[q.id].forEach((opt,i)=>{const row=document.createElement('div');row.className='ans'+(opt===q.correct?' correct':'')+(answers[q.id]===opt&&opt!==q.correct?' wrong':'');row.textContent=letters[i]+'. '+opt+(opt===q.correct?' — ĐÁP ÁN ĐÚNG':answers[q.id]===opt?' — MÀY ĐÃ CHỌN':'');item.appendChild(row)});const status=document.createElement('div');status.style.cssText='font-size:12px;color:var(--muted);margin-top:9px';status.textContent=answers[q.id]===undefined?'Trạng thái: Chưa làm':isCorrect(q)?'Trạng thái: Đã làm đúng':'Trạng thái: Đã làm sai';item.appendChild(status);if(q.note){const note=document.createElement('div');note.style.cssText='font-size:12px;color:var(--muted);margin-top:7px';note.textContent='Ghi chú: '+q.note;item.appendChild(note)}list.appendChild(item)})}
function reset(){clearTimeout(autoTimer);autoTimer=null;answers={};submitted=false;current=0;reviewFilter='all';document.body.classList.remove('graded');startRandomSession();$('result').classList.remove('show');$('reviewView').classList.remove('show');$('quizView').classList.remove('hidden');$('score').textContent='0/10';$('resultSummary').textContent='';$('correctCount').textContent='0';$('unanswered').textContent=String(questions.length);document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.filter==='all'));render();window.scrollTo({top:0,behavior:'smooth'})}
$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('submitTop').onclick=submit;$('submitSide').onclick=submit;$('resetTop').onclick=reset;$('retake').onclick=reset;$('reviewWrong').onclick=()=>showReview('wrong');$('reviewAll').onclick=()=>showReview('all');$('showReview').onclick=()=>showReview('all');$('backQuiz').onclick=()=>{$('reviewView').classList.remove('show');$('quizView').classList.remove('hidden');render()};document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>showReview(b.dataset.filter));
const themeButton=$('themeToggle');function setTheme(dark){document.body.classList.toggle('dark',dark);themeButton.textContent=dark?'☀ Nền sáng':'☾ Nền tối';document.querySelector('meta[name=theme-color]').content=dark?'#111513':'#f7f7f5';try{localStorage.setItem('quiz-theme',dark?'dark':'light')}catch(e){}}themeButton.onclick=()=>setTheme(!document.body.classList.contains('dark'));try{setTheme(localStorage.getItem('quiz-theme')==='dark')}catch(e){setTheme(false)}$('total').textContent=questions.length;startRandomSession();render();
</script></body></html>
